<!DOCTYPE html>
<html lang="id" data-theme="biru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PK KNPI Cibinong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ THEME TOKENS ============ */
:root, [data-theme="biru"]{
  --primary:#0B3D91; --primary-dark:#072a66; --primary-light:#1E5FBF;
  --accent:#FFC72C; --accent-dark:#E0A800;
  --bg:#F1F4FA; --surface:#FFFFFF; --surface-2:#E7ECF6;
  --text:#161E2E; --muted:#6B7686; --border:#E1E6F0;
  --danger:#D64545; --success:#1E9E5A;
  --on-primary:#FFFFFF;
}
[data-theme="merah-putih"]{
  --primary:#B3122A; --primary-dark:#7D0C1E; --primary-light:#D93A50;
  --accent:#0B3D91; --accent-dark:#072a66;
  --bg:#FAF3F1; --surface:#FFFFFF; --surface-2:#F3E6E4;
  --text:#241416; --muted:#7A6668; --border:#EBD9D6;
  --danger:#B3122A; --success:#1E9E5A; --on-primary:#FFFFFF;
}
[data-theme="hijau"]{
  --primary:#0E7C4A; --primary-dark:#075733; --primary-light:#2AAA6B;
  --accent:#FFC72C; --accent-dark:#E0A800;
  --bg:#F0F7F3; --surface:#FFFFFF; --surface-2:#E2F0E8;
  --text:#122019; --muted:#647A70; --border:#D9EBE1;
  --danger:#D64545; --success:#0E7C4A; --on-primary:#FFFFFF;
}
[data-theme="navy-elegan"]{
  --primary:#13294B; --primary-dark:#0A182F; --primary-light:#24406E;
  --accent:#C9A227; --accent-dark:#A98618;
  --bg:#0C1626; --surface:#13223B; --surface-2:#1B3054;
  --text:#EAF0FA; --muted:#93A3BE; --border:#26385A;
  --danger:#E06767; --success:#3FBE84; --on-primary:#FFFFFF;
}
[data-theme="maroon-emas"]{
  --primary:#7A1220; --primary-dark:#4E0B14; --primary-light:#9E2233;
  --accent:#D4AF37; --accent-dark:#B7962A;
  --bg:#FAF4EC; --surface:#FFFFFF; --surface-2:#F2E4CE;
  --text:#241512; --muted:#7C6A5F; --border:#EADFCB;
  --danger:#D64545; --success:#1E9E5A; --on-primary:#FFFFFF;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

/* ===== MOBILE-STYLE LAYOUT: narrow column, no phone-frame mockup ===== */
.stage{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:var(--bg);
}
.phone{
  width:100%;
  max-width:460px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
}
@media (min-width:461px){
  .stage{ background:var(--surface-2); }
  .phone{ box-shadow:0 0 40px rgba(0,0,0,.06); }
}
.phone-scroll{ flex:1; display:flex; flex-direction:column; min-height:100vh; }

/* ===== HEADER ===== */
.topbar{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:14px 16px 16px;
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:40;
  box-shadow:0 4px 14px rgba(0,0,0,.15);
}
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.logo-badge{
  width:38px; height:38px; border-radius:11px; background:var(--accent);
  color:var(--primary-dark); display:flex; align-items:center; justify-content:center;
  font-family:'Poppins'; font-weight:800; font-size:14px; flex-shrink:0; overflow:hidden;
}
.logo-badge img{width:100%;height:100%;object-fit:cover;}
.brand-text{min-width:0;}
.brand-text .name{font-family:'Poppins'; font-weight:700; font-size:14.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-text .tag{font-size:10.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.icon-btn{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center; border:none; color:#fff; flex-shrink:0;
}
.icon-btn:active{background:rgba(255,255,255,.28);}

/* ===== MAIN VIEW ===== */
.view{flex:1; padding-bottom:90px;}
.section{padding:18px 16px 6px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.section-head h2{font-size:15.5px; font-weight:700;}
.section-head .more{font-size:11.5px; color:var(--primary); font-weight:600;}

/* ===== HERO ===== */
.hero{
  margin:14px 16px; border-radius:20px; padding:22px 18px 20px;
  background:linear-gradient(150deg,var(--primary-light),var(--primary) 60%, var(--primary-dark));
  color:#fff; position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px;
  background:radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
}
.hero .eyebrow{font-size:10.5px; letter-spacing:1.6px; font-weight:700; opacity:.85; text-transform:uppercase;}
.hero h1{font-size:21px; font-weight:800; margin:6px 0 8px; line-height:1.25;}
.hero p{font-size:12.5px; opacity:.92; line-height:1.5; max-width:92%;}
.hero-actions{display:flex; gap:8px; margin-top:16px;}
.btn{
  border:none; border-radius:11px; padding:10px 14px; font-size:12.5px; font-weight:700;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-accent{background:var(--accent); color:var(--primary-dark);}
.btn-ghost{background:rgba(255,255,255,.16); color:#fff;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--primary); color:var(--primary);}
.btn-block{width:100%; justify-content:center;}
.btn-sm{padding:7px 10px; font-size:11.5px; border-radius:9px;}
.btn-danger{background:#fdeceb; color:var(--danger);}

/* stat chips */
.stats{display:flex; gap:8px; padding:0 16px; margin:2px 0 4px;}
.stat{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 8px; text-align:center;}
.stat b{display:block; font-family:'Poppins'; font-size:16px; color:var(--primary);}
.stat span{font-size:9.5px; color:var(--muted); font-weight:600;}

/* horizontal scroller */
.hscroll{display:flex; gap:11px; overflow-x:auto; padding:2px 16px 10px;}
.card-news{
  min-width:190px; max-width:190px; background:var(--surface); border-radius:16px; overflow:hidden;
  border:1px solid var(--border); flex-shrink:0;
}
.card-news .thumb{height:96px; width:100%; object-fit:cover; background:var(--surface-2);}
.card-news .body{padding:9px 10px 11px;}
.badge{display:inline-block; font-size:9px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--surface-2); color:var(--primary);}
.card-news h3{font-size:12px; font-weight:700; margin:6px 0 3px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-news .date{font-size:9.5px; color:var(--muted);}

.gscroll{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 14px;}
.gthumb{width:78px; height:78px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--surface-2);}

/* list cards (berita / kegiatan) */
.list-card{
  display:flex; gap:11px; background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:10px; margin:0 16px 11px;
}
.list-card .thumb{width:84px; height:84px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--surface-2);}
.list-card .info{flex:1; min-width:0;}
.list-card h3{font-size:13px; font-weight:700; line-height:1.3; margin-bottom:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.list-card p{font-size:11px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.list-card .meta{display:flex; gap:6px; align-items:center; margin-top:6px; font-size:9.5px; color:var(--muted); font-weight:600;}

.chip-row{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 12px;}
.chip{
  flex-shrink:0; padding:7px 13px; border-radius:20px; background:var(--surface); border:1px solid var(--border);
  font-size:11.5px; font-weight:600; color:var(--muted);
}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}

/* about tabs content */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin:0 16px 14px;}
.card h3{font-size:14px; font-weight:700; margin-bottom:8px; color:var(--primary);}
.card p{font-size:12.5px; line-height:1.65; color:var(--text);}
.misi-item{display:flex; gap:9px; margin-bottom:10px; font-size:12.5px; line-height:1.5;}
.misi-num{
  width:22px; height:22px; border-radius:7px; background:var(--surface-2); color:var(--primary);
  font-family:'Poppins'; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.struktur-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 14px;}
.person{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:12px 10px; text-align:center;}
.person .avatar{
  width:52px; height:52px; margin:0 auto 8px; border-radius:50%; background:linear-gradient(135deg,var(--primary-light),var(--primary));
  color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:700; font-size:16px; overflow:hidden;
}
.person .avatar img{width:100%;height:100%;object-fit:cover;}
.person b{font-size:11.5px; display:block; line-height:1.3;}
.person span{font-size:9.5px; color:var(--muted); display:block; margin-top:2px;}

.map-wrap{margin:0 16px 14px; border-radius:16px; overflow:hidden; border:1px solid var(--border);}
.map-wrap iframe{width:100%; height:190px; border:0; display:block;}
.map-info{background:var(--surface); padding:12px 14px;}

.contact-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin:0 16px 10px;}
.contact-row .cico{width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.contact-row .ctext b{font-size:12.5px; display:block;}
.contact-row .ctext span{font-size:11px; color:var(--muted);}

/* gallery grid */
.gal-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; padding:2px 16px 16px;}
.gal-grid .gitem{position:relative; border-radius:10px; overflow:hidden; aspect-ratio:1/1; background:var(--surface-2);}
.gal-grid .gitem img{width:100%; height:100%; object-fit:cover;}

/* forms */
.field{margin-bottom:12px;}
.field label{font-size:11.5px; font-weight:700; color:var(--muted); display:block; margin-bottom:5px;}
.field input[type=text], .field input[type=password], .field input[type=email], .field input[type=tel], .field input[type=date], .field textarea, .field select{
  width:100%; border:1.5px solid var(--border); border-radius:11px; padding:10px 12px; font-size:12.5px; font-family:inherit; background:var(--surface); color:var(--text);
}
.field textarea{resize:vertical; min-height:80px;}
.upload-box{
  border:1.6px dashed var(--border); border-radius:13px; padding:14px; text-align:center; font-size:11.5px; color:var(--muted); position:relative; background:var(--surface-2);
}
.upload-box input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.upload-preview{width:100%; max-height:130px; object-fit:cover; border-radius:10px; margin-bottom:8px;}
.photo-mini-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px;}
.photo-mini-grid .pm{position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;}
.photo-mini-grid .pm img{width:100%;height:100%;object-fit:cover;}
.photo-mini-grid .pm button{position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:10px; line-height:1;}

/* bottom nav */
.bottomnav{
  position:sticky; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
  display:flex; z-index:50; padding:6px 2px 8px;
}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); padding:6px 2px;}
.navbtn svg{width:20px; height:20px;}
.navbtn span{font-size:8.6px; font-weight:700;}
.navbtn.active{color:var(--primary);}

/* detail / overlay panel */
.overlay{
  position:absolute; inset:0; background:var(--bg); z-index:70; display:flex; flex-direction:column; transform:translateX(100%);
  transition:transform .28s ease;
}
.overlay.open{transform:translateX(0);}
.overlay-head{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
  position:sticky; top:0;
}
.overlay-head h2{font-size:14px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.overlay-body{flex:1; overflow-y:auto; padding-bottom:30px;}
.detail-cover{width:100%; height:190px; object-fit:cover; background:var(--surface-2);}
.detail-pad{padding:16px;}
.detail-pad h1{font-size:17px; font-weight:800; line-height:1.35; margin-bottom:6px;}
.detail-pad .meta{font-size:11px; color:var(--muted); margin-bottom:14px; font-weight:600;}
.detail-pad .content{font-size:13px; line-height:1.8; white-space:pre-line;}

/* toast */
#toast{
  position:absolute; left:16px; right:16px; bottom:96px; background:#161E2E; color:#fff; padding:11px 14px; border-radius:12px;
  font-size:12px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:.25s; text-align:center;
}
#toast.show{opacity:1; transform:translateY(-4px);}

/* lightbox */
#lightbox{position:absolute; inset:0; background:rgba(5,8,16,.94); z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column;}
#lightbox.show{display:flex;}
#lightbox img{max-width:92%; max-height:70%; border-radius:8px;}
#lightbox .lb-cap{color:#fff; font-size:12px; margin-top:12px; text-align:center; padding:0 20px;}
#lightbox .lb-close{position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none;}
#lightbox .lb-nav{position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:16px;}
#lightbox .lb-prev{left:10px;} #lightbox .lb-next{right:10px;}

/* admin */
.tabbar{display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px;}
.tabbar button{flex-shrink:0; padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:11.5px; font-weight:700; color:var(--muted);}
.tabbar button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.admin-item{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 12px; margin:0 16px 10px; display:flex; gap:10px; align-items:center;}
.admin-item img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--surface-2);}
.admin-item .ai-info{flex:1; min-width:0;}
.admin-item .ai-info b{font-size:12px; display:block; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.admin-item .ai-info span{font-size:10px; color:var(--muted);}
.admin-item .ai-actions{display:flex; gap:6px;}
.icon-mini{width:30px;height:30px;border-radius:8px;background:var(--surface-2); border:none; display:flex; align-items:center; justify-content:center; color:var(--text);}
.theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 16px;}
.theme-swatch{border-radius:14px; padding:12px; border:2px solid var(--border); position:relative; cursor:pointer; background:var(--surface);}
.theme-swatch.selected{border-color:var(--primary);}
.theme-swatch .dots{display:flex; gap:5px; margin-bottom:8px;}
.theme-swatch .dot{width:16px; height:16px; border-radius:50%;}
.theme-swatch b{font-size:11.5px;}
.lock-screen{padding:60px 24px; text-align:center;}
.lock-screen .li{width:64px; height:64px; border-radius:18px; background:var(--surface-2); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:12.5px;}
.empty b{display:block; color:var(--text); font-size:14px; margin-bottom:5px; font-family:'Poppins';}
.divider{height:1px; background:var(--border); margin:6px 16px 14px;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="phone-scroll" id="phoneScroll">

      <div class="topbar">
        <div class="brand" onclick="handleBrandTap()" style="cursor:pointer; user-select:none;">
          <div class="logo-badge" id="logoBadge">KC</div>
          <div class="brand-text">
            <div class="name" id="brandName">PK KNPI Cibinong</div>
            <div class="tag" id="brandTag">Bersatu, Berkarya, Berdaya</div>
          </div>
        </div>
      </div>

      <div class="view" id="view"></div>

      <div class="bottomnav" id="bottomnav"></div>

      <!-- overlays -->
      <div class="overlay" id="overlayDetail">
        <div class="overlay-head">
          <button class="icon-btn" onclick="closeOverlay()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
          <h2 id="overlayTitle">Detail</h2>
        </div>
        <div class="overlay-body" id="overlayBody"></div>
      </div>

      <div id="toast"></div>

      <div id="lightbox">
        <button class="lb-close" onclick="closeLightbox()">✕</button>
        <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
        <img id="lbImg" src="">
        <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
        <div class="lb-cap" id="lbCap"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ================= PENYIMPANAN DATA (FIREBASE FIRESTORE) =================
   Situs ini awalnya dibuat sebagai Claude Artifact yang memakai
   window.storage bawaan Claude. Saat di-host mandiri (Vercel), storage
   itu tidak ada, jadi di sini window.storage dibuat ulang agar memakai
   Firebase Firestore langsung dari browser (tanpa perlu API route atau
   environment variable di Vercel), supaya semua data yang diubah lewat
   panel admin tersimpan permanen dan terlihat oleh semua pengunjung.

   CARA SETUP (sekali saja):
   1) Buka https://console.firebase.google.com, buat project baru (gratis).
   2) Di project itu, klik "Build" > "Firestore Database" > "Create database"
      > pilih lokasi terdekat (misalnya asia-southeast1/2) > mode
      "Start in test mode" (supaya bisa langsung baca/tulis).
   3) Klik ikon gerigi (Project settings) > scroll ke "Your apps" > klik
      ikon "</>" (Web) > daftarkan app (nama bebas) > Firebase akan
      menampilkan objek firebaseConfig seperti di bawah ini.
   4) Copy nilai apiKey, authDomain, projectId, dst dari Firebase, lalu
      ganti nilai FIREBASE_CONFIG di bawah ini dengan nilai Anda.
   5) (Opsional tapi disarankan setelah situs jalan) Di Firestore >
      tab "Rules", ganti supaya hanya bisa ditulis, bukan sembarang
      orang di internet bisa mengubah data lewat konsol browser. Untuk
      situs sederhana seperti ini, rules default "test mode" (berlaku
      30 hari lalu terkunci) sudah cukup untuk mulai; setelah itu perlu
      diperpanjang manual di tab Rules Firestore (klik "Publish" lagi). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDwRGLg8qo3ns8_RSQLMrXe3oG7r0w1--s",
  authDomain: "pkknpicibinong.firebaseapp.com",
  projectId: "pkknpicibinong",
  storageBucket: "pkknpicibinong.firebasestorage.app",
  messagingSenderId: "50353718742",
  appId: "1:50353718742:web:fd216bf1991e65451ed077",
};

const _fbApp = firebase.initializeApp(FIREBASE_CONFIG);
const _fbDb = firebase.firestore();
const _FB_COLLECTION = 'knpicibinong'; // semua data disimpan di koleksi ini, 1 dokumen per key
const _FB_CHUNK_SIZE = 700000; // batas aman per dokumen (Firestore max ~1MB/dokumen)

/* Firestore membatasi ukuran 1 dokumen sekitar 1MB. Karena berita/galeri
   di situs ini menyimpan foto sebagai teks base64 (bisa jadi besar kalau
   ada beberapa foto sekaligus), data seperti itu perlu dipecah otomatis
   menjadi beberapa dokumen kecil ("chunk") supaya tidak ditolak Firestore.
   Fungsi di bawah ini menangani pemecahan & penggabungan itu secara
   transparan, sehingga kode admin (saveNews, saveGal, dst) tidak perlu
   diubah sama sekali. */
window.storage = {
  async get(key){
    try{
      const doc = await _fbDb.collection(_FB_COLLECTION).doc(key).get();
      if(!doc.exists) return null;
      const data = doc.data();
      if(data && data.chunked){
        const count = data.count || 0;
        const parts = await Promise.all(
          Array.from({length: count}, (_, i) =>
            _fbDb.collection(_FB_COLLECTION).doc(key + '__chunk_' + i).get()
          )
        );
        const value = parts.map(p => (p.exists ? p.data().part : '')).join('');
        return { key, value, shared: true };
      }
      if(data.value === null || data.value === undefined) return null;
      return { key, value: data.value, shared: true };
    }catch(e){ console.error('storage.get error', e); return null; }
  },
  async set(key, value){
    try{
      const str = typeof value === 'string' ? value : JSON.stringify(value);
      // Hapus dulu chunk lama (kalau sebelumnya dokumen ini pernah di-chunk
      // dengan jumlah lebih banyak), supaya tidak ada sisa data basi.
      const oldDoc = await _fbDb.collection(_FB_COLLECTION).doc(key).get();
      const oldCount = (oldDoc.exists && oldDoc.data().chunked) ? (oldDoc.data().count || 0) : 0;

      if(str.length > _FB_CHUNK_SIZE){
        const chunks = [];
        for(let i=0; i<str.length; i+=_FB_CHUNK_SIZE) chunks.push(str.slice(i, i+_FB_CHUNK_SIZE));
        const batch = _fbDb.batch();
        chunks.forEach((part, i) => {
          batch.set(_fbDb.collection(_FB_COLLECTION).doc(key + '__chunk_' + i), { part });
        });
        for(let i=chunks.length; i<oldCount; i++){
          batch.delete(_fbDb.collection(_FB_COLLECTION).doc(key + '__chunk_' + i));
        }
        batch.set(_fbDb.collection(_FB_COLLECTION).doc(key), { chunked: true, count: chunks.length, updatedAt: Date.now() });
        await batch.commit();
      } else {
        const batch = _fbDb.batch();
        for(let i=0; i<oldCount; i++){
          batch.delete(_fbDb.collection(_FB_COLLECTION).doc(key + '__chunk_' + i));
        }
        batch.set(_fbDb.collection(_FB_COLLECTION).doc(key), { value, chunked: false, updatedAt: Date.now() });
        await batch.commit();
      }
      return { key, value, shared: true };
    }catch(e){ console.error('storage.set error', e); toast && toast('Gagal menyimpan: ' + (e.message||e)); return null; }
  },
  async delete(key){
    try{
      const oldDoc = await _fbDb.collection(_FB_COLLECTION).doc(key).get();
      const oldCount = (oldDoc.exists && oldDoc.data().chunked) ? (oldDoc.data().count || 0) : 0;
      const batch = _fbDb.batch();
      for(let i=0; i<oldCount; i++){
        batch.delete(_fbDb.collection(_FB_COLLECTION).doc(key + '__chunk_' + i));
      }
      batch.delete(_fbDb.collection(_FB_COLLECTION).doc(key));
      await batch.commit();
      return { key, deleted: true, shared: true };
    }catch(e){ console.error('storage.delete error', e); return null; }
  },
  async list(prefix){
    try{
      const snap = await _fbDb.collection(_FB_COLLECTION).get();
      const keys = [];
      snap.forEach(doc => {
        if(doc.id.includes('__chunk_')) return; // sembunyikan dokumen pecahan internal
        if(!prefix || doc.id.startsWith(prefix)) keys.push(doc.id);
      });
      return { keys, prefix: prefix || undefined, shared: true };
    }catch(e){ console.error('storage.list error', e); return null; }
  }
};

/* ================= HELPERS ================= */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  const bulan=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return dt.getDate()+' '+bulan[dt.getMonth()]+' '+dt.getFullYear();
}
function uid(){ return 'id'+Date.now()+Math.floor(Math.random()*1000); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function resizeImage(file, maxDim=900, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ================= SECRET ADMIN ACCESS =================
   Halaman admin TIDAK ditampilkan di menu manapun. Cara masuk:
   1) Ketik/buka URL dengan akhiran  #kc-admin-2026
   2) Atau ketuk logo/nama organisasi di header sebanyak 5x berturut-turut (dalam 2 detik)
   3) Atau di desktop, tekan tombol Ctrl + Alt + A
   Ganti kode rahasia ini kapan saja sesuai selera Anda. */
const SECRET_HASH = '#kc-admin-2026';
let _tapCount = 0, _tapTimer = null;
function handleBrandTap(){
  _tapCount++;
  clearTimeout(_tapTimer);
  _tapTimer = setTimeout(()=>{ _tapCount = 0; }, 2000);
  if(_tapCount >= 5){
    _tapCount = 0;
    go('admin');
  } else {
    go('beranda');
  }
}
window.addEventListener('hashchange', ()=>{
  if(location.hash === SECRET_HASH){ go('admin'); history.replaceState(null,'',location.pathname); }
});
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.altKey && (e.key==='a' || e.key==='A')){ e.preventDefault(); go('admin'); }
});

/* ================= RENDER: ROUTER ================= */
function render(){
  applyTheme(); renderBrand(); renderNav();
  const v = document.getElementById('view');
  if(page==='beranda') v.innerHTML = viewBeranda();
  else if(page==='tentang') v.innerHTML = viewTentang();
  else if(page==='berita') v.innerHTML = viewBerita();
  else if(page==='kegiatan') v.innerHTML = viewKegiatan();
  else if(page==='galeri') v.innerHTML = viewGaleri();
  else if(page==='kontak') v.innerHTML = viewKontak();
  else if(page==='admin') v.innerHTML = viewAdmin();
}

function newNewsForm(){ editingNews={category:'Umum', title:'', excerpt:'', content:'', image:'', date:new Date().toISOString().slice(0,10)}; render(); }
function editNewsForm(id){ editingNews = {...NEWS.find(n=>n.id===id)}; render(); }
function cancelNewsForm(){ editingNews=null; render(); }
async function handleNewsImg(e){
  const file = e.target.files[0]; if(!file) return;
  const url = await resizeImage(file, 900, 0.72);
  editingNews.image = url; render();
}
async function saveNewsForm(){
  const title = document.getElementById('nfTitle').value.trim();
  if(!title){ toast('Judul wajib diisi'); return; }
  const data = {
    id: editingNews.id || uid(),
    category: document.getElementById('nfCat').value,
    title,
    excerpt: document.getElementById('nfExcerpt').value.trim(),
    content: document.getElementById('nfContent').value.trim(),
    date: document.getElementById('nfDate').value || new Date().toISOString().slice(0,10),
    image: editingNews.image || placeholderImg('Berita','#0B3D91','#1E5FBF')
  };
  const idx = NEWS.findIndex(n=>n.id===data.id);
  if(idx>=0) NEWS[idx]=data; else NEWS.unshift(data);
  await saveNews();
  editingNews=null; toast('Berita disimpan'); render();
}
async function deleteNews(id){
  NEWS = NEWS.filter(n=>n.id!==id); await saveNews(); toast('Berita dihapus'); render();
}

      <div class="ai-info"><b>${esc(a.title)}</b><span>${fmtDate(a.date)} &bull; ${(a.photos||[]).length} foto</span></div>
      <div class="ai-actions">
        <button class="icon-mini" onclick="editActForm('${a.id}')">${ICONS.edit}</button>
        <button class="icon-mini" onclick="deleteAct('${a.id}')">${ICONS.trash}</button>
      </div>
    </div>`).join('') : '<div class="empty">Belum ada kegiatan.</div>')}
  `;
}
function newActForm(){ editingAct={title:'', date:new Date().toISOString().slice(0,10), location:'', desc:'', cover:'', photos:[]}; render(); }
function editActForm(id){ editingAct = JSON.parse(JSON.stringify(ACT.find(a=>a.id===id))); render(); }
function cancelActForm(){ editingAct=null; render(); }
async function handleActCover(e){ const file=e.target.files[0]; if(!file) return; editingAct.cover = await resizeImage(file,900,0.72); render(); }
async function handleActPhotos(e){
  const files=[...e.target.files]; if(!files.length) return;
  editingAct.photos = editingAct.photos||[];
  for(const f of files){ editingAct.photos.push(await resizeImage(f, 800, 0.68)); }
  render();
}
function removeActPhoto(i){ editingAct.photos.splice(i,1); render(); }
async function saveActForm(){
  const title = document.getElementById('afTitle').value.trim();
  if(!title){ toast('Judul wajib diisi'); return; }
  const data = {
    id: editingAct.id || uid(),
    title,
    date: document.getElementById('afDate').value || new Date().toISOString().slice(0,10),
    location: document.getElementById('afLoc').value.trim(),
    desc: document.getElementById('afDesc').value.trim(),
    cover: editingAct.cover || placeholderImg('Kegiatan','#0B3D91','#1E5FBF'),
    photos: editingAct.photos||[]
  };
  const idx = ACT.findIndex(a=>a.id===data.id);
  if(idx>=0) ACT[idx]=data; else ACT.unshift(data);
  await saveAct();
  editingAct=null; toast('Kegiatan disimpan'); render();
}
async function deleteAct(id){ ACT = ACT.filter(a=>a.id!==id); await saveAct(); toast('Kegiatan dihapus'); render(); }

/* -- Admin: Galeri -- */
function adminGaleri(){
  return `
  <div class="section"><div class="section-head"><h2>Tambah Foto Galeri</h2></div></div>
  <div class="card">
    <div class="field"><label>Kategori</label><input type="text" id="gfCat" placeholder="Contoh: Kegiatan, Rapat, Sosial"></div>
    <div class="field"><label>Keterangan Foto</label><input type="text" id="gfCap" placeholder="Keterangan singkat"></div>
    <div class="field"><label>Unggah Foto (bisa lebih dari satu)</label>
      <div class="upload-box">Ketuk untuk pilih foto<input type="file" accept="image/*" multiple onchange="handleGalUpload(event)"></div>
    </div>
  </div>
  <div class="section"><div class="section-head"><h2>Semua Foto (${GAL.length})</h2></div></div>
  <div class="gal-grid">
    ${GAL.map(g=>`
      <div class="gitem">
        <img src="${g.image}">
        <button class="icon-mini" style="position:absolute; top:4px; right:4px; width:22px; height:22px; background:rgba(0,0,0,.55); color:#fff;" onclick="deleteGal('${g.id}')">${ICONS.trash.replace('width="24" height="24"','width="12" height="12"')}</button>
      </div>`).join('') || ''}
  </div>
  ${GAL.length===0?'<div class="empty">Galeri masih kosong.</div>':''}
  `;
}
async function handleGalUpload(e){
  const files=[...e.target.files]; if(!files.length) return;
  const cat = document.getElementById('gfCat').value.trim() || 'Umum';
  const cap = document.getElementById('gfCap').value.trim();
  for(const f of files){
    const img = await resizeImage(f, 800, 0.68);
    GAL.unshift({id:uid(), image:img, caption:cap, category:cat});
  }
  await saveGal();
  toast('Foto ditambahkan'); render();
}
async function deleteGal(id){ GAL = GAL.filter(g=>g.id!==id); await saveGal(); toast('Foto dihapus'); render(); }

/* -- Admin: Tentang Kami -- */
function adminTentang(){
  const p = editingPerson;
  return `
  <div class="section"><div class="section-head"><h2>Visi</h2></div></div>
  <div class="card"><textarea id="atVisi" style="min-height:80px; width:100%; border:1.5px solid var(--border); border-radius:11px; padding:10px 12px; font-size:12.5px; font-family:inherit;">${esc(CFG.visi)}</textarea></div>

  <div class="section"><div class="section-head"><h2>Misi</h2><span class="more" onclick="addMisi()">+ Tambah poin</span></div></div>
  <div class="card">
    ${CFG.misi.map((m,i)=>`
      <div class="field" style="display:flex; gap:6px; align-items:flex-start;">
        <textarea style="flex:1" oninput="CFG.misi[${i}]=this.value">${esc(m)}</textarea>
        <button class="icon-mini" onclick="removeMisi(${i})">${ICONS.trash}</button>
      </div>`).join('')}
  </div>

  <div class="section"><div class="section-head"><h2>Profil Organisasi</h2></div></div>
  <div class="card"><textarea id="atProfil" style="min-height:140px; width:100%; border:1.5px solid var(--border); border-radius:11px; padding:10px 12px; font-size:12.5px; font-family:inherit;">${esc(CFG.profil)}</textarea></div>

  <div class="section"><div class="section-head"><h2>Struktur Organisasi</h2><span class="more" onclick="addPerson()">+ Tambah</span></div></div>
  ${CFG.struktur.map(pr=>`
    <div class="admin-item">
      <div class="logo-badge" style="border-radius:50%;">${pr.photo?`<img src="${pr.photo}">`:esc((pr.name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
      <div class="ai-info"><b>${esc(pr.name)}</b><span>${esc(pr.jabatan)}</span></div>
      <div class="ai-actions">
        <button class="icon-mini" onclick="editPerson(${pr.id})">${ICONS.edit}</button>
        <button class="icon-mini" onclick="removePerson(${pr.id})">${ICONS.trash}</button>
      </div>
    </div>`).join('')}

  ${p ? `
  <div class="card">
    <h3>${p.isNew?'Tambah Pengurus':'Edit Pengurus'}</h3>
    <div class="field"><label>Foto (opsional)</label>
      <div class="upload-box">${p.photo?`<img class="upload-preview" src="${p.photo}">`:''}Ketuk untuk unggah<input type="file" accept="image/*" onchange="handlePersonPhoto(event)"></div>
    </div>
    <div class="field"><label>Nama</label><input type="text" id="pfName" value="${esc(p.name)}"></div>
    <div class="field"><label>Jabatan</label><input type="text" id="pfJabatan" value="${esc(p.jabatan)}"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline btn-block" onclick="editingPerson=null; render()">Batal</button>
      <button class="btn btn-primary btn-block" onclick="savePerson()">Simpan</button>
    </div>
  </div>` : ''}

  <div style="padding:0 16px 20px">
    <button class="btn btn-primary btn-block" onclick="saveAboutText()">Simpan Visi, Misi &amp; Profil</button>
  </div>
  `;
}
function addMisi(){ CFG.misi.push('Poin misi baru'); render(); }
function removeMisi(i){ CFG.misi.splice(i,1); render(); }
async function saveAboutText(){
  CFG.visi = document.getElementById('atVisi').value.trim();
  CFG.profil = document.getElementById('atProfil').value.trim();
  await saveConfig(); toast('Perubahan disimpan'); render();
}
function addPerson(){ editingPerson={id:Date.now(), name:'', jabatan:'', photo:null, isNew:true}; render(); }
function editPerson(id){ editingPerson = {...CFG.struktur.find(p=>p.id===id)}; render(); }
async function handlePersonPhoto(e){ const file=e.target.files[0]; if(!file) return; editingPerson.photo = await resizeImage(file, 400, 0.75); render(); }
async function savePerson(){
  const name = document.getElementById('pfName').value.trim();
  if(!name){ toast('Nama wajib diisi'); return; }
  const data = {id:editingPerson.id, name, jabatan:document.getElementById('pfJabatan').value.trim(), photo:editingPerson.photo||null};
  const idx = CFG.struktur.findIndex(p=>p.id===data.id);
  if(idx>=0) CFG.struktur[idx]=data; else CFG.struktur.push(data);
  await saveConfig(); editingPerson=null; toast('Pengurus disimpan'); render();
}
async function removePerson(id){ CFG.struktur = CFG.struktur.filter(p=>p.id!==id); await saveConfig(); toast('Dihapus'); render(); }

/* -- Admin: Pengaturan -- */
function adminPengaturan(){
  return `
  <div class="section"><div class="section-head"><h2>Identitas Situs</h2></div></div>
  <div class="card">
    <div class="field"><label>Logo</label>
      <div class="upload-box">
        ${CFG.logo?`<img class="upload-preview" src="${CFG.logo}" style="max-height:80px; width:auto; margin:0 auto 8px;">`:''}
        Ketuk untuk unggah logo<input type="file" accept="image/*" onchange="handleLogoUpload(event)">

    </div>
    <div class="field"><label>Singkatan (untuk badge jika tanpa logo)</label><input type="text" id="stShort" value="${esc(CFG.orgShort)}" maxlength="3"></div>
    <div class="field"><label>Nama Organisasi</label><input type="text" id="stName" value="${esc(CFG.orgName)}"></div>
    <div class="field"><label>Nama Lengkap</label><input type="text" id="stFull" value="${esc(CFG.orgFull)}"></div>
    <div class="field"><label>Tagline (header)</label><input type="text" id="stTagline" value="${esc(CFG.tagline)}"></div>
    <div class="field"><label>Judul Hero (beranda)</label><input type="text" id="stHeroTitle" value="${esc(CFG.heroTitle)}"></div>
    <div class="field"><label>Subjudul Hero</label><textarea id="stHeroSub">${esc(CFG.heroSubtitle)}</textarea></div>
    <div class="field"><label>Statistik Beranda</label>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
        <input type="text" id="stat1" value="${esc(CFG.stat1)}" placeholder="Angka">
        <input type="text" id="stat2" value="${esc(CFG.stat2)}" placeholder="Angka">
        <input type="text" id="stat3" value="${esc(CFG.stat3)}" placeholder="Angka">
      </div>

        <input type="text" id="stat2L" value="${esc(CFG.stat2Label)}" placeholder="Label">
        <input type="text" id="stat3L" value="${esc(CFG.stat3Label)}" placeholder="Label">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveIdentity()">Simpan Identitas</button>

  <div class="section"><div class="section-head"><h2>Kontak &amp; Lokasi</h2></div></div>

    <div class="field"><label>Nomor WA untuk tombol chat (format 62xxxx)</label><input type="text" id="stWa" value="${esc(CFG.wa)}"></div>
    <div class="field"><label>Email</label><input type="text" id="stEmail" value="${esc(CFG.email)}"></div>
    <div class="field"><label>Username Instagram</label><input type="text" id="stIg" value="${esc(CFG.ig)}"></div>
    <div class="field"><label>Nama Halaman Facebook</label><input type="text" id="stFb" value="${esc(CFG.fb)}"></div>

    <button class="btn btn-primary btn-block" onclick="saveContactSettings()">Simpan Kontak &amp; Lokasi</button>

async function saveIdentity(){

  CFG.orgFull = document.getElementById('stFull').value.trim();

  CFG.heroTitle = document.getElementById('stHeroTitle').value.trim();
  CFG.heroSubtitle = document.getElementById('stHeroSub').value.trim();
  CFG.stat1 = document.getElementById('stat1').value.trim();
  CFG.stat2 = document.getElementById('stat2').value.trim();
  CFG.stat3 = document.getElementById('stat3').value.trim();
  CFG.stat1Label = document.getElementById('stat1L').value.trim();
  CFG.stat2Label = document.getElementById('stat2L').value.trim();
  CFG.stat3Label = document.getElementById('stat3L').value.trim();
  await saveConfig(); toast('Identitas disimpan'); render();

async function saveContactSettings(){
  CFG.alamat = document.getElementById('stAlamat').value.trim();
  CFG.telp = document.getElementById('stTelp').value.trim();

  CFG.email = document.getElementById('stEmail').value.trim();
  CFG.ig = document.getElementById('stIg').value.trim();

  CFG.mapLink = document.getElementById('stMapLink').value.trim();

async function chooseTheme(id){ CFG.theme=id; await saveConfig(); render(); toast('Tema diterapkan'); }
